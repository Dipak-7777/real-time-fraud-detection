[project]
name = "real-time-fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
]

[project.scripts]
real-time-fraud-detection = "real_time_fraud_detection:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
