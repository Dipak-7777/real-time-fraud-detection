version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./fraud_detection.db:/app/fraud_detection.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./fraud_detection.db:/app/fraud_detection.db
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge
